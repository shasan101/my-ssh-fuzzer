services:
  dropbear-ssh:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.dropbear
    user: "1000:1000"
    networks:
      - dropbear_network
    volumes:
      - ./ssh-keys/learner-ssh.pub:/home/learner/.ssh/id_rsa.pub:ro
      - ./ssh-keys/learner-ssh:/home/learner/.ssh/id_rsa:ro
    entrypoint: ["sh", "-c", "mkdir -p /home/learner/.ssh && cp /home/learner/.ssh/id_rsa.pub /home/learner/.ssh/authorized_keys && chmod 600 /home/learner/.ssh/authorized_keys && /usr/local/sbin/dropbear -F -E -s -p 22"]

  dropbear-mapper:
    build:
      context: ../../ssh-mapper
      dockerfile: Dockerfile
    user: "1000:1000"
    depends_on:
      - dropbear-ssh
    networks:
      - dropbear_network
    volumes:
      - ./ssh-keys/learner-ssh.pub:/home/learner/.ssh/id_rsa.pub:ro
      - ./ssh-keys/learner-ssh:/home/learner/.ssh/id_rsa:ro
    command: -l 0.0.0.0:8080 -s dropbear-ssh:22 -f server

  dropbear-learner:
    build:
      context: ../../ssh-learner
      dockerfile: Dockerfile
    user: "1000:1000"
    networks:
      - dropbear_network
    depends_on:
      - dropbear-ssh
      - dropbear-mapper
    volumes:
      - ./learner_output_dropbear:/app/output_folder
      - ../../ssh-learner/inputs/alphabets/servers/:/app/inputs/alphabets/servers/
    command: ["java", "-cp", "./ssh-learner.jar:./lib/*", "learner.Main", "state-fuzzer-server", "-connect", "dropbear-mapper:8080", "-alphabet", "/app/inputs/alphabets/servers/trans_auth.xml", "-output", "/app/output_folder", "-sshMapperAddress", "dropbear-mapper:8080", "-roundLimit", "3", "-debug"]

networks:
  dropbear_network: {}
